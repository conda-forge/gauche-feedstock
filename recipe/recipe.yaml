schema_version: 1

context:
  name: gauche
  version: "0.1.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gauche-${{ version }}.tar.gz
  sha256: f658523fd24eae2751ff9c86d50c6ef1ab2386402c07030f46028fccfa529791

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - scikit-learn
    - scipy
    - matplotlib-base
    - seaborn
    - jupyterlab
    - ipykernel
    - rdkit
    - tqdm
    - selfies
    - pytorch
    - gpytorch
    - botorch

tests:
  - python:
      imports:
        - gauche
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Gaussian Process Library for Molecules, Chemical Reactions and Proteins.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/leojklarner/gauche

extra:
  recipe-maintainers:
    - jan-janssen
